# Full-stack local dev (Mongo + backend + frontend). This lives in the BACKEND repo.
# It expects the FRONTEND repo checked out as a sibling folder named `frontend`
# (i.e. run `docker compose up` from the backend repo root, with ../frontend present).
services:
  mongo:
    image: mongo:7
    container_name: ghanipur-mongo
    restart: unless-stopped
    # Single-node replica set so multi-doc transactions work locally (§36).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiate the replica set advertising the Docker service name so clients in
      # other containers (backend) can reach the primary — NOT localhost.
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  backend:
    build: .
    container_name: ghanipur-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ghanipur?replicaSet=rs0
      # DynamoDB (transitional, alongside Mongo until the port is complete —
      # see the migration plan). No AWS_ACCESS_KEY_ID/SECRET on EC2: the
      # instance role is used there; set them in .env only for local Docker.
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      DYNAMO_ENDPOINT: ${DYNAMO_ENDPOINT:-}
      DYNAMO_TABLE_PREFIX: ${DYNAMO_TABLE_PREFIX:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-min-16-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-16-chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:5000}
      SUPER_ADMIN_SETUP_KEY: ${SUPER_ADMIN_SETUP_KEY:-}
      ADMIN_SETUP_KEY: ${ADMIN_SETUP_KEY:-}
      EXPOSE_OTP: ${EXPOSE_OTP:-}
      # SMTP for real OTP emails (set these in .env to actually send email)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"

  frontend:
    build:
      # Frontend repo path (sibling clone). Override FRONTEND_CONTEXT in .env if the
      # frontend was cloned under a different folder name (e.g. ../ghanipur-frontend).
      context: ${FRONTEND_CONTEXT:-../frontend}
      args:
        # Same-origin: the browser hits the Next server, which proxies /api/v1 and
        # /uploads to the backend (keeps the auth cookie first-party).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:5000}
    container_name: ghanipur-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      # SSR runs inside this container — reach the backend by its service name,
      # not the browser's localhost URL.
      INTERNAL_API_URL: http://backend:5000/api/v1
    ports:
      - "3000:3000"

volumes:
  mongo_data:
  uploads_data:

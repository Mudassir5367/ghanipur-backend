# Deployment stack for the Ghanipur BACKEND.
#
# There is no database container. DynamoDB is the only datastore and it is a
# managed AWS service, so the API talks to it over the network using the EC2
# instance role — nothing to run, nothing to back up here, and no data volume
# that can be lost with the box.
#
# Backend and frontend run on SEPARATE EC2 machines, so they cannot share a
# Docker network — the frontend reaches this API by address. The Next server
# proxies /api/v1 and /uploads to BACKEND_ORIGIN (set in the frontend's .env) so
# the browser only ever talks to the frontend origin and the refresh cookie
# stays first-party.
#
# ACCESS CONTROL IS THE SECURITY GROUP. Port 5000 is published on all interfaces
# because the other machine must reach it; restrict inbound 5000 to the frontend
# instance only (its security group, or its IP /32). Do NOT leave it open to
# 0.0.0.0/0 — every API route would be publicly reachable.

services:
  backend:
    build: .
    image: ghanipur-backend:latest
    container_name: ghanipur-backend
    restart: unless-stopped
    # Secrets and tunables come from .env (see .env.production.example).
    env_file: .env
    # These pin the container's own wiring and intentionally OVERRIDE .env.
    environment:
      NODE_ENV: production
      PORT: "5000"
      UPLOAD_DIR: /app/uploads
    volumes:
      # Product images still live on local disk (S3-ready — the DB stores URLs).
      # This is now the only stateful thing on the machine.
      - uploads_data:/app/uploads
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  uploads_data:

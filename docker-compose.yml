# Deployment stack for the Ghanipur BACKEND (Mongo + API).
#
# The frontend is a separate repo and a separate compose stack. Both attach to
# the shared external network `ghanipur-net`, which is how the Next server
# resolves this API as `backend:5000` and proxies /api/v1 + /uploads to it.
#
# Create the shared network once, before the first `up`:
#   docker network create ghanipur-net
#
# Ports: nothing here is published to the internet. Browser traffic arrives at
# the frontend on :3000 and is proxied inward over ghanipur-net. The API is
# bound to 127.0.0.1 for on-box curl/debugging, and Mongo is not published at
# all — it runs WITHOUT authentication, so it must stay off any public interface.

services:
  mongo:
    image: mongo:7
    container_name: ghanipur-mongo
    restart: unless-stopped
    # Single-node replica set so multi-doc transactions work (§36).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiate the replica set advertising the Docker service name so clients
      # in other containers (backend) can reach the primary — NOT localhost.
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - ghanipur-internal
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    build: .
    image: ghanipur-backend:latest
    container_name: ghanipur-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # Secrets and tunables come from .env (see .env.production.example).
    env_file: .env
    # These pin the container's own wiring and intentionally OVERRIDE .env, so a
    # stale host-oriented value there can't break the stack.
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/ghanipur?replicaSet=rs0
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      # Loopback only — the frontend reaches this over ghanipur-net, not the host.
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    networks:
      - ghanipur-internal
      - ghanipur-net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  mongo_data:
  uploads_data:

networks:
  # Private to this stack: only the API talks to Mongo.
  ghanipur-internal:
  # Shared with the frontend stack.
  ghanipur-net:
    external: true
    name: ghanipur-net

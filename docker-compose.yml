# Deployment stack for the Ghanipur BACKEND (Mongo + API).
#
# Backend and frontend run on SEPARATE EC2 machines, so they cannot share a
# Docker network — the frontend reaches this API over the network by address.
# The Next server proxies /api/v1 and /uploads to BACKEND_ORIGIN (set in the
# frontend's .env) so the browser still only ever talks to the frontend origin
# and the refresh cookie stays first-party.
#
# ACCESS CONTROL IS THE SECURITY GROUP. Port 5000 is published on all
# interfaces because the other machine must reach it; restrict inbound 5000 to
# the frontend instance only (its security group, or its IP /32). Do NOT leave
# it open to 0.0.0.0/0 — every API route would be publicly reachable.
#
# Mongo has no authentication and is deliberately never published: it is
# reachable only from the backend container over the private compose network.

services:
  mongo:
    image: mongo:7
    container_name: ghanipur-mongo
    restart: unless-stopped
    # Single-node replica set so multi-doc transactions work (§36).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiate the replica set advertising the Docker service name so the
      # backend container can reach the primary — NOT localhost.
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - ghanipur-internal
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    build: .
    image: ghanipur-backend:latest
    container_name: ghanipur-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # Secrets and tunables come from .env (see .env.production.example).
    env_file: .env
    # These pin the container's own wiring and intentionally OVERRIDE .env, so a
    # stale host-oriented value there can't break the stack.
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/ghanipur?replicaSet=rs0
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    networks:
      - ghanipur-internal
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  mongo_data:
  uploads_data:

networks:
  # Private to this machine: only the API talks to Mongo.
  ghanipur-internal:
